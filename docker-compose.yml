services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: minddock-postgres

    environment:
      POSTGRES_DB: minddock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - minddock-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  ollama:
    image: ollama/ollama:latest
    container_name: minddock-ollama

    ports:
      - "127.0.0.1:11434:11434"

    volumes:
      - minddock-ollama-data:/root/.ollama

    restart: unless-stopped

volumes:
  minddock-postgres-data:
  minddock-ollama-data: